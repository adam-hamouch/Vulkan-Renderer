name: Claude Code Review

# Note : anthropics/claude-code-action ne supporte pas l'événement `push`,
# on lance donc directement la CLI Claude Code.

on:
  push:
    branches: [main]
  workflow_dispatch:   # relance manuelle depuis l'onglet Actions (review du dernier commit)

permissions:
  contents: write      # nécessaire pour commenter un commit

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Calculer le diff
        id: diff
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "cmd=git show ${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=git diff $BEFORE ${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Review
        env:
          # Token lié à l'abonnement Claude (généré via `claude setup-token`),
          # stocké dans Settings > Secrets and variables > Actions
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DIFF_CMD: ${{ steps.diff.outputs.cmd }}
        run: |
          cat > prompt.md <<'PROMPT'
          Tu fais la code review d'un push sur un moteur de rendu Vulkan en C++20 avec une couche RHI.

          CONTEXTE :
          La RHI compile désormais (interfaces I*.h + implémentations Vulkan*). Le projet est en
          phase de nettoyage puis d'ajout de features (ECS, frame graph, deferred, PBR...).
          Un job CI séparé vérifie déjà la compilation : ne commente une erreur de compilation que
          si elle est évidente dans le diff.
          - Pars des MODIFICATIONS de ce commit, puis vérifie leur cohérence avec le reste du projet :
            appelants et implémentations impactés, interfaces I*.h modifiées sans que les classes
            Vulkan* ou le code client suivent, ressources dont la durée de vie ou l'ordre de
            destruction change, synchronisation (fences/semaphores, frames in flight).
          - Remarques d'architecture bienvenues si le commit introduit un couplage ou une
            responsabilité mal placée (ex. logique hors rôle dans VulkanDevice, type Vk* exposé
            dans une interface, dépendance client -> backend Vulkan).
          - Pas d'audit exhaustif du projet à chaque commit : reste centré sur ce que le commit touche.

          Points à vérifier en priorité :
          - Séparation RHI : aucun include Vulkan (vulkan.h, GLFW_INCLUDE_VULKAN, types Vk*)
            dans les headers d'interface (Code/Include/RHI/I*.h, RHI.h, RHIUtils.h).
          - Les static_cast interface -> implémentation Vulkan restent confinés aux Code/Source/RHI/Vulkan*.cpp.
          - Fuites de ressources : chaque vkCreate*/vkAllocate* a son vkDestroy*/vkFree* correspondant,
            pas de double destroy.
          - Ordre d'init/destruction.
          - Tailles de std::array cohérentes avec le nombre réel d'éléments (attributs, clearValues, attachments).
          - Sample count MSAA cohérent entre render pass, images et pipeline.
          - Command buffers : enregistrement entre begin/end, pas d'utilisation après submit.
          - Alignement std140 des UBO.
          - Bugs C++ classiques : variables non initialisées, cast incorrects, range-for invalides.

          Ignore le style et les détails cosmétiques. Sois concis, en français, en markdown.
          Pour chaque problème : `fichier:ligne`, ce qui ne va pas, correction proposée.
          Si rien d'important, dis-le en une ligne.
          Ta réponse finale doit contenir UNIQUEMENT la review (elle sera postée telle quelle).
          PROMPT
          printf '\nRécupère le diff avec : `%s`, puis relis les fichiers modifiés si le contexte est nécessaire.\n' "$DIFF_CMD" >> prompt.md

          claude -p "$(cat prompt.md)" \
            --max-turns 20 \
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git show:*),Bash(git log:*)" \
            > review.md

          echo "----- review -----"; cat review.md

      - name: Poster la review sur le commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s review.md ] || { echo "Review vide"; exit 1; }
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@review.md
