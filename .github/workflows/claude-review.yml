name: Claude Code Review

on:
  push:
    branches: [main]

permissions:
  contents: write      # nécessaire pour commenter un commit
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Token lié à l'abonnement Claude (généré via `claude setup-token`),
          # stocké dans Settings > Secrets and variables > Actions
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 15
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh api:*)"
          prompt: |
            Tu fais la code review du push ${{ github.sha }} sur le repo ${{ github.repository }},
            un moteur de rendu Vulkan en C++20 avec une couche RHI.

            CONTEXTE DE TRAVAIL (important) :
            Le projet est en refactor progressif et long : le pipeline Vulkan du tutoriel
            (gros fichier de base, ex. main.cpp / Application) est reconstitué morceau par morceau
            sous forme de RHI (interfaces I*.h + implémentations Vulkan*). À chaque push le projet
            NE COMPILE PAS, c'est attendu : le fichier de base est découpé au fur et à mesure,
            des classes sont à moitié écrites, des Destroy()/méthodes sont encore vides, des
            appels pointent vers du code pas encore migré.
            - Ne signale PAS : erreurs de compilation, symboles manquants, méthodes vides ou TODO,
              code mort ou commenté dans le fichier de base, intégration pas encore branchée.
            - Concentre-toi sur les MODIFICATIONS de ce commit : le code ajouté ou changé est-il
              correct en lui-même, et fidèle à ce qu'il remplace dans le code Vulkan d'origine
              (paramètres perdus, flags/enum mal convertis, ordre d'appels changé, ressource créée
              sans destroy prévu, logique dupliquée entre l'ancien fichier et la RHI) ?
            - Garde la vue d'ensemble en tête mais ne fais pas d'audit global du projet. Une remarque
              d'architecture RHI n'est utile que si ce commit introduit un choix qui posera
              problème quand la RHI sera fonctionnelle.

            1. Récupère le diff : `git diff ${{ github.event.before }} ${{ github.sha }}`.
               Si `before` vaut 0000000..., utilise `git show ${{ github.sha }}`.
            2. Relis les fichiers modifiés en entier si le contexte est nécessaire.

            Points à vérifier en priorité :
            - Séparation RHI : aucun include Vulkan (vulkan.h, GLFW_INCLUDE_VULKAN, types Vk*)
              dans les headers d'interface (Code/Include/RHI/I*.h, RHI.h, RHIUtils.h).
            - Les static_cast interface -> implémentation Vulkan restent confinés aux Code/Source/RHI/Vulkan*.cpp.
            - Fuites de ressources : chaque vkCreate*/vkAllocate* a son vkDestroy*/vkFree* correspondant,
              pas de double destroy (ex. descriptor pool détruit dans cleanup ET cleanupSwapChain).
            - Ordre d'init/destruction (ex. swap chain avant caméra, destruction en ordre inverse).
            - Tailles de std::array cohérentes avec le nombre réel d'éléments (attributs, clearValues, attachments).
            - Sample count MSAA cohérent entre render pass, images et pipeline.
            - Command buffers : enregistrement entre begin/end, pas d'utilisation après submit.
            - Alignement std140 des UBO.
            - Bugs C++ classiques : variables non initialisées, cast incorrects, range-for invalides.

            Ignore le style et les détails cosmétiques. Sois concis, en français.
            Pour chaque problème : fichier:ligne, ce qui ne va pas, correction proposée.
            Si rien d'important, dis-le en une ligne.

            Poste la review en commentaire sur le commit :
            `gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="<review>"`
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
